# -----------------------------------------------------------------------------
# Main
# -----------------------------------------------------------------------------
log-level: silent # silent, debug, warning

mode: rule
ipv6: false
allow-lan: false
keep-alive-interval: 30

find-process-mode: always

# Делать задержки более естественными (чтобы не выдавать автоматизацию)
# Повышение точности тестирования скорости прокси-серверов
# Рекомендуется держать включённым для стабильной работы
unified-delay: true

# Одновременно проверяет несколько IP-адресов и использует самый быстрый для подключения
tcp-concurrent: true

profile:
  store-selected: true
  # Сохранение таблицы fake-ip между перезапусками
  store-fake-ip: true # Указано прозапас, если вдруг будет использоваться fake-ip

# -----------------------------------------------------------------------------
# Tun
# -----------------------------------------------------------------------------
mixed-port: 7890
socks-port: 7891
redir-port: 7892
tun:
  enable: true
  stack: mixed
  device: mihomo
  auto-detect-interface: true
  auto-route: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  route-exclude-address: # Исключить из перехвата приватные и зарезервированные IP-адреса
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::1/127
    - fc00::/7
    - fe80::/10
    - ff00::/8

# -----------------------------------------------------------------------------
# Sniffer
# -----------------------------------------------------------------------------
# Функция "подслушивания" трафика для определения доменных имён
# Позволяет корректно маршрутизировать трафик даже при подключении по IP-адресу
# Критически важно для работы правил на основе доменных имён
sniffer:
  enable: true    # Включить сниффер
  parse-pure-ip: true    # Анализировать IP-адреса без домена
  force-dns-mapping: true    # Принудительно использовать DNS-маппинг
  override-destination: true # Подменять получателя трафика на домен
  sniff:    # Настройки для различных протоколов
    HTTP:
      ports: [80, 8080-8880]    # Порты для HTTP-трафика
      override-destination: true
    TLS:
      ports: [443, 8443]    # Порты для HTTPS/TLS-трафика
    # Не сниффится, т.к. блокируется правилом UDP/443
    # QUIC:
    #   ports: [443, 8443]    # Порты для QUIC-протокола (UDP/443)

# -----------------------------------------------------------------------------
# Proxies
# -----------------------------------------------------------------------------
proxies: # LEAVE THIS LINE!

# -----------------------------------------------------------------------------
# Proxy groups
# -----------------------------------------------------------------------------
# Иконки
icon_random: &icon_random https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png
icon_rocket: &icon_rocket https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
icon_youtube: &icon_youtube https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
icon_instagram: &icon_instagram https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Instagram.png
icon_discord: &icon_discord https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
icon_telegram: &icon_telegram https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png

# Регулярное выражение для исключения российских прокси
exclude_ru: &exclude_ru "(?i)🇷🇺|(^|[^a-z])RU([^a-z]|$)|Россия|Russia|Москва|Moscow"

# Конфигурация URL-тестирования для выбора fastest-прокси
# Используется для url-test-групп (автоматический выбор по скорости)
url_test: &url_test
  url: http://www.gstatic.com/generate_204
  interval: 300
  lazy: false           # Тестирование при запуске
  expected-status: 204
  tolerance: 50         # Допустимая разница задержки (мс)

proxy-groups:
  - name: REMNAWAVE
    icon: *icon_random
    type: select
    exclude-filter: *exclude_ru
    proxies: # LEAVE THIS LINE!

  - name: FASTEST
    <<: *url_test
    icon: *icon_rocket
    type: url-test
    hidden: true
    include-all: true
    exclude-filter: *exclude_ru
    remnawave:
      include-proxies: false
    proxies: # LEAVE THIS LINE!

  - name: PROXY
    type: select
    remnawave:
      include-proxies: false
    proxies: [ REMNAWAVE, FASTEST ]

  - name: DISCORD
    icon: *icon_discord
    type: select
    proxies: [ FASTEST ]

  - name: TELEGRAM
    icon: *icon_telegram
    type: select
    proxies: [ FASTEST ]

  - name: INSTAGRAM
    icon: *icon_instagram
    type: select
    proxies: [ FASTEST ]
      
  - name: YOUTUBE
    icon: *icon_youtube
    type: select
    proxies: [ FASTEST ]

# -----------------------------------------------------------------------------
# Rule provider bases
# -----------------------------------------------------------------------------
rule_provider_base: &rule_provider_base
  type: http    # Тип: HTTP (скачивать из интернета)
  interval: 86400    # Интервал обновления: 24 часа

rule_behavior_domain_mrs: &rule_behavior_domain_mrs
  <<: *rule_provider_base
  behavior: domain    # Тип правила: домены
  format: mrs    # Формат: Meta Ruleset

rule_behavior_ipcidr_mrs: &rule_behavior_ipcidr_mrs
  <<: *rule_provider_base
  behavior: ipcidr    # Тип правила: IP-диапазоны
  format: mrs    # Формат: Meta Ruleset

# Специальный шаблон для классических правил (torrent-clients)
rule_behavior_classical_yaml: &rule_behavior_classical_yaml
  <<: *rule_provider_base
  behavior: classical    # Тип правила: классический
  format: yaml    # Формат: YAML

# -----------------------------------------------------------------------------
# Rule providers
# -----------------------------------------------------------------------------
rule-providers:
  apps-direct:
    <<: *rule_behavior_classical_yaml
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/apps_windows_direct_mihomo.yaml
    path: ./rules/apps_windows_direct_mihomo.yaml

  geoip-direct:
    <<: *rule_behavior_ipcidr_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geoip_direct.mrs
    path: ./rules/geoip_direct.mrs

  geosite-direct:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_direct.mrs
    path: ./rules/geosite_direct.mrs

  apps-proxy:
    <<: *rule_behavior_classical_yaml
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/apps_windows_proxy_mihomo.yaml
    path: ./rules/apps_windows_proxy_mihomo.yaml

  geoip-proxy:
    <<: *rule_behavior_ipcidr_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geoip_proxy.mrs
    path: ./rules/geoip_proxy.mrs

  geosite-proxy:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_proxy.mrs
    path: ./rules/geosite_proxy.mrs

  geosite-bitwarden:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_bitwarden.mrs
    path: ./rules/geosite_bitwarden.mrs

  geosite-google:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_google.mrs
    path: ./rules/geosite_google.mrs

  geosite-youtube:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_youtube.mrs
    path: ./rules/geosite_youtube.mrs

  geosite-instagram:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_instagram.mrs
    path: ./rules/geosite_instagram.mrs

  geosite-discord:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_discord.mrs
    path: ./rules/geosite_discord.mrs

  geosite-telegram:
    <<: *rule_behavior_domain_mrs
    url: https://github.com/aligotr/rule-set-ru/releases/latest/download/geosite_telegram.mrs
    path: ./rules/geosite_telegram.mrs

# -----------------------------------------------------------------------------
# DNS
# -----------------------------------------------------------------------------
# Чёрный список -> DoH через группу PROXY (по IP, без резолва имени)
# Исключения DIRECT и всё остальное -> DNS текущей сети (локальный/роутера/провайдера)
dns:
  enable: true
  ipv6: false

  # Использование локальных сопоставлений domain -> ip
  use-hosts: true  
  # Использование системных сопоставлений domain -> ip
  use-system-hosts: true

  # Режим работы DNS:
  # redir-host — возврат реальных IP (лучше для совместимости с белым списком);
  # fake-ip — возврат виртуальных IP из пула (быстрее, но может обнаруживаться приложениями).
  enhanced-mode: redir-host

  # Резолв имён DNS-серверов, только IP
  default-nameserver:
    - 77.88.8.8
    - 77.88.8.1

  # Резолв имён PROXY-серверов
  proxy-server-nameserver:
    - 77.88.8.8
    - 77.88.8.1

  # Запросы не попадающие под правила политик nameserver-policy
  nameserver:
    - system

  # Серверы для доменов, попадающих под DIRECT-правила
  direct-nameserver:
    - system

  # Работает только при непустом direct-nameserver
  # true: сначала проверяется nameserver-policy, и если домен там есть, берётся его DNS (например, DoH через #PROXY). Остальное идёт в direct-nameserver.
  # false: mihomo сам резолвит домен для соединения с выходом DIRECT, он использует только direct-nameserver и игнорирует политики
  # В данном случае false, нужен чтобы любое DIRECT-соединение резолвилось DNS текущей сети.
  direct-nameserver-follow-policy: false

  # Правила выбора dns-сервера
  nameserver-policy:
    "rule-set:geosite-bitwarden": system
    "rule-set:geosite-discord": &doh_proxy
      - https://1.1.1.1/dns-query#PROXY
      - https://8.8.8.8/dns-query#PROXY
    "rule-set:geosite-telegram": *doh_proxy
    "rule-set:geosite-instagram": *doh_proxy
    "rule-set:geosite-youtube": *doh_proxy
    "rule-set:geosite-direct": system
    "rule-set:geosite-google": *doh_proxy
    "rule-set:geosite-proxy": *doh_proxy
    "+.dnsleaktest.com": *doh_proxy
    "+.myip.com": *doh_proxy
    "+.2ip.io": *doh_proxy
    "+.ip.sb": *doh_proxy
    "+.ipip.net": *doh_proxy
    "+.ipwho.is": *doh_proxy
  
  # ---- fake-ip: Заготовка (работает, когда клиент включит fake-ip) ----
  # ---- Вариант 1 (Режим правил) ---
  # Логика как в rules: сверху вниз. real-ip = настоящий адрес от DNS сети
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,geosite-direct,real-ip
    - RULE-SET,geosite-bitwarden,real-ip
    - RULE-SET,geosite-discord,fake-ip
    - RULE-SET,geosite-telegram,fake-ip
    - RULE-SET,geosite-instagram,fake-ip
    - RULE-SET,geosite-youtube,fake-ip
    - RULE-SET,geosite-google,fake-ip
    - RULE-SET,geosite-proxy,fake-ip
    - DOMAIN-SUFFIX,dnsleaktest.com,fake-ip
    - DOMAIN-SUFFIX,myip.com,fake-ip
    - DOMAIN-SUFFIX,2ip.io,fake-ip
    - DOMAIN-SUFFIX,ip.sb,fake-ip
    - DOMAIN-SUFFIX,ipip.net,fake-ip
    - DOMAIN-SUFFIX,ipwho.is,fake-ip
    - MATCH,real-ip
  # ---- Вариант 2 (Fake-ip для всего, кроме исключений) ----
  # fake-ip-filter-mode: blacklist
  # fake-ip-filter:
  #   # Локальные сети
  #   - "+.lan"
  #   - "+.local"
  #   - "+.localdomain"
  #   - "+.home.arpa"
  #   - "+.internal"
  #   # Российские домены
  #   - "+.ru"
  #   - "+.su"
  #   - "+.xn--p1ai"
  #   - "rule-set:geosite-direct"
  #   # Служебное
  #   - "rule-set:geosite-bitwarden"
  #   - "stun.*.*.*"
  #   - "stun.*.*"
  #   - "+.msftconnecttest.com"
  #   - "+.msftncsi.com"
  #   - "time.*.com"
  #   - "ntp.*.com"
  #   - "+.pool.ntp.org"

# -----------------------------------------------------------------------------
# Rules
# -----------------------------------------------------------------------------
rules:
# 🏠 Локальная сеть
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - OR,((DOMAIN-SUFFIX,lan),(DOMAIN-SUFFIX,local),(DOMAIN-SUFFIX,localhost)),DIRECT

# 🚫 BLOCK
  # HTTP3/QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP

  # NetBIOS
  - AND,((NETWORK,UDP),(DST-PORT,135/137-139)),REJECT-DROP
  
  # IPv6-трафик
  - IP-CIDR,::/0,REJECT-DROP,no-resolve

# 🔬 Tests
  - OR,((DOMAIN-SUFFIX,dnsleaktest.com),(DOMAIN-SUFFIX,myip.com),(DOMAIN-SUFFIX,2ip.io),(DOMAIN-SUFFIX,ip.sb),(DOMAIN-SUFFIX,ipip.net),(DOMAIN-SUFFIX,ipwho.is)),PROXY

# 📦 Services
  - RULE-SET,apps-direct,DIRECT
  - RULE-SET,geosite-bitwarden,DIRECT

  - PROCESS-NAME-REGEX,(?i)^discord,DISCORD
  - RULE-SET,geosite-telegram,TELEGRAM
  - RULE-SET,geosite-discord,DISCORD
  - RULE-SET,geosite-instagram,INSTAGRAM
  - RULE-SET,geosite-youtube,YOUTUBE
  - RULE-SET,apps-proxy,PROXY

# 🌐 Rule-sets
  - RULE-SET,geosite-direct,DIRECT
  - RULE-SET,geosite-google,PROXY
  - RULE-SET,geosite-proxy,PROXY

# 🔢 IP-sets and udp-ports
  - RULE-SET,geoip-direct,DIRECT,no-resolve

# По порту сервис не определить: подписи справочные
# --- STUN/TURN (общие) ---
  - AND,((NETWORK,UDP),(DST-PORT,3478/3480/3484)),PROXY
# --- Discord ---
  - AND,((NETWORK,UDP),(DST-PORT,50000-50030)),PROXY
# --- Telegram (релеи звонков) ---
  - AND,((NETWORK,UDP),(DST-PORT,596-599/1400)),PROXY
# --- Google Meet ---
  - AND,((NETWORK,UDP),(DST-PORT,19302-19309)),PROXY
# --- Под вопросом (обычно TCP) ---
  - AND,((NETWORK,UDP),(DST-PORT,5222)),PROXY

  - RULE-SET,geoip-proxy,PROXY,no-resolve

# 🏁 FINAL
  - MATCH,DIRECT
